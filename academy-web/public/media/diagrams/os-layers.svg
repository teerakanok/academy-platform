<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-label="Programs sit above the operating system, hardware sits below it">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7FCDF3"/>
    </marker>
  </defs>
  <text x="360" y="22" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E7A8A">Everything you run asks the operating system first</text>
  <rect x="60" y="40" width="130" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="125.0" y="64.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">Your browser</text>
  <rect x="205" y="40" width="130" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="270.0" y="64.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">A text editor</text>
  <rect x="350" y="40" width="130" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="415.0" y="64.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#5E7A8A">A shell command</text>
  <rect x="495" y="40" width="145" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="567.5" y="64.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">A background service</text>
  <path d="M350 88 L350 108" stroke="#7FCDF3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="115" width="580" height="122" rx="16" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <text x="350" y="137" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E7A8A">The operating system does four jobs, all the time</text>
  <rect x="78" y="150" width="130" height="62" rx="10" fill="#38BDF8"/>
  <text x="143.0" y="179.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#06121C">Runs things</text>
  <text x="143.0" y="196.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">shares the CPU</text>
  <rect x="222" y="150" width="130" height="62" rx="10" fill="#38BDF8"/>
  <text x="287.0" y="179.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#06121C">Remembers</text>
  <text x="287.0" y="196.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">hands out memory</text>
  <rect x="366" y="150" width="130" height="62" rx="10" fill="#38BDF8"/>
  <text x="431.0" y="179.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#06121C">Stores</text>
  <text x="431.0" y="196.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">files and folders</text>
  <rect x="510" y="150" width="112" height="62" rx="10" fill="#38BDF8"/>
  <text x="566.0" y="179.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#06121C">Decides</text>
  <text x="566.0" y="196.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">who may do what</text>
  <path d="M350 245 L350 265" stroke="#7FCDF3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="272" width="130" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="125.0" y="296.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">CPU</text>
  <rect x="205" y="272" width="130" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="270.0" y="296.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">Memory</text>
  <rect x="350" y="272" width="130" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="415.0" y="296.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">Disk</text>
  <rect x="495" y="272" width="145" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="567.5" y="296.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E7A8A">Network card</text>
  <text x="350" y="334" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E7A8A">Hardware — none of it is touched directly by your programs</text>
</svg>
