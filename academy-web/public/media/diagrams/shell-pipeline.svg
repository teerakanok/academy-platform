<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 226" width="758" height="226" role="img" aria-label="A shell pipeline passes text from one command to the next">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7FCDF3"/>
    </marker>
  </defs>
  <text x="379.0" y="22" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E7A8A">Each step reads what the step before it printed — nothing is saved in between</text>
  <rect x="24" y="44" width="158" height="58" rx="10" fill="#38BDF8"/>
  <text x="103.0" y="71.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#06121C">cat access.log</text>
  <text x="103.0" y="88.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">every line</text>
  <path d="M186 73 L204 73" stroke="#7FCDF3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="208" y="44" width="158" height="58" rx="10" fill="#38BDF8"/>
  <text x="287.0" y="71.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#06121C">grep ' 404 '</text>
  <text x="287.0" y="88.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">only the failures</text>
  <path d="M370 73 L388 73" stroke="#7FCDF3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="392" y="44" width="158" height="58" rx="10" fill="#38BDF8"/>
  <text x="471.0" y="71.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#06121C">cut -d' ' -f7</text>
  <text x="471.0" y="88.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">just the path</text>
  <path d="M554 73 L572 73" stroke="#7FCDF3" stroke-width="2" marker-end="url(#a)"/>
  <rect x="576" y="44" width="158" height="58" rx="10" fill="#38BDF8"/>
  <text x="655.0" y="71.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#06121C">sort | uniq -c</text>
  <text x="655.0" y="88.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#06121C" opacity="0.75">counted</text>
  <text x="379.0" y="132" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E7A8A">One long line of text goes in; a short answer comes out.</text>
  <rect x="259.0" y="148" width="240" height="40" rx="10" fill="none" stroke="#7FCDF3" stroke-width="1.5"/>
  <text x="379.0" y="172.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#5E7A8A">12  /admin/login</text>
  <text x="379.0" y="208" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E7A8A">Stop at any point and look — that is how you debug a pipeline.</text>
</svg>
