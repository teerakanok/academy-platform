services:
  academy-retention-api:
    image: postgrest/postgrest:v14.8@sha256:4173b72e0be29cf15349dc827798c3e464c5f2cc7f9c1697022f9cd1874b4c36
    container_name: academy-retention-api
    restart: unless-stopped
    env_file:
      - .env.academy-retention-api
    environment:
      PGRST_DB_SCHEMAS: academy
      PGRST_DB_ANON_ROLE: academy_retention_api_anon
      PGRST_JWT_AUD: academy-retention-api
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:${ACADEMY_RETENTION_API_PORT:-50601}:3000"
    networks:
      - supabase_default

  academy-retention-api-health:
    image: curlimages/curl:8.17.0@sha256:43ebaa53d3806db6b1ce4353b6b26ae638ec1c167ee351524b05690f988bb20d
    platform: linux/amd64
    container_name: academy-retention-api-health
    restart: unless-stopped
    depends_on:
      academy-retention-api:
        condition: service_started
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://academy-retention-api:3000/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true
